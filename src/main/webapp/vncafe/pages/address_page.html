        <form id="addressForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="First and Last Name" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="10-digit mobile number" required>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" placeholder="Enter 6-digit pincode" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="locality">Locality</label>
                    <input type="text" id="locality" placeholder="Street Name, Apartment/Building" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" rows="3" placeholder="House No., Building, Street, Area" required></textarea>
            </div>

            <div class="form-group">
                <label for="landmark">Landmark (Optional)</label>
                <input type="text" id="landmark" placeholder="e.g., Near Main Road, Opposite Mall">
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="city">Town/City</label>
                    <input type="text" id="city" >
                </div>
                <div class="form-group col-md-6">
                    <label for="state">State</label>
                    <input type="text" id="state" >
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save Address</button>
            <button type="button" class="btn btn-secondary">Cancel</button>
        </form>

        <h2>Saved Addresses</h2>
        <div id="savedAddressesList">
            </div>
    </div>

        <script>document.addEventListener('DOMContentLoaded', function() {
        const pincodeField = document.getElementById('pincode');
        const cityField = document.getElementById('city');
        const stateField = document.getElementById('state');
        const addressForm = document.getElementById('addressForm');
        const savedAddressesList = document.getElementById('savedAddressesList');

        let savedAddresses = [

        ];
        function renderSavedAddresses() {
            savedAddressesList.innerHTML = '';
            if (savedAddresses.length > 0) {
                savedAddresses.forEach((address, index) => {
                    const addressDiv = document.createElement('div');
                    addressDiv.classList.add('saved-address-item');
                    addressDiv.innerHTML = `
                        <div class="address-details">
                            <strong>${address.name} (${address.type})</strong><br>
                            ${address.address}, ${address.locality}<br>
                            ${address.city}, ${address.state} - ${address.pincode}<br>
                            Mobile: ${address.mobile}
                        </div>
                        <div class="address-actions">
                            <button onclick="editAddress(${index})">Edit</button>
                            <button onclick="removeAddress(${index})">Remove</button>
                            <button onclick="deliverHere(${index})">Deliver Here</button>
                        </div>
                    `;
                    savedAddressesList.appendChild(addressDiv);
                });
            } else {
                savedAddressesList.innerHTML = '<p>No saved addresses.</p>';
            }
        }

        pincodeField.addEventListener('input', function() {
            const pincode = this.value;
            if (pincode.length === 6 && /^[0-9]+$/.test(pincode)) {
                if (pincode.startsWith('110')) {
                    cityField.value = 'New Delhi';
                    stateField.value = 'Delhi';
                } else if (pincode.startsWith('560')) {
                    cityField.value = 'Bangalore';
                    stateField.value = 'Karnataka';
                } else if (pincode.startsWith('400')) {
                    cityField.value = 'Mumbai';
                    stateField.value = 'Maharashtra';
                } else {
                    cityField.value = '';
                    stateField.value = '';
                }
            } else {
                cityField.value = '';
                stateField.value = '';
            }
        });
    
        addressForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            const newAddress = {};
            formData.forEach((value, key) => {
                newAddress[key] = value;
            });
            savedAddresses.push(newAddress);
            renderSavedAddresses();
            addressForm.reset();
            alert('Address saved!');
        });

        window.editAddress = function(index) {
            const addressToEdit = savedAddresses[index];
            document.getElementById('name').value = addressToEdit.name;
            document.getElementById('mobile').value = addressToEdit.mobile;
            document.getElementById('pincode').value = addressToEdit.pincode;
            document.getElementById('locality').value = addressToEdit.locality;
            document.getElementById('address').value = addressToEdit.address;
            document.getElementById('landmark').value = addressToEdit.landmark;
            document.getElementById('city').value = addressToEdit.city;
            document.getElementById('state').value = addressToEdit.state;
            document.querySelector(input[name="addressType"][value="${addressToEdit.type}"]).checked = true;
    
        };
    
        window.removeAddress = function(index) {
            if (confirm('Are you sure you want to remove this address?')) {
                savedAddresses.splice(index, 1);
                renderSavedAddresses();
            }
        };
    
        window.deliverHere = function(index) {
            const selectedAddress = savedAddresses[index];
            alert(`Delivering to: ${selectedAddress.name}, ${selectedAddress.address}, ${selectedAddress.city} - ${selectedAddress.pincode}`);
        };
        renderSavedAddresses();
    });</script>

    <script>
      //  profile icon show user details
    
      const user = JSON.parse(localStorage.getItem("user"));
      const token = localStorage.getItem("token");
    
      const navProfileBtn = document.getElementById("navProfileBtn");
      const signDivBtn = document.getElementById("signDivBtn");
    
      if (user && token) {
        if (signDivBtn) {
          signDivBtn.classList.add("d-none");
        }
        if (navProfileBtn) {
          navProfileBtn.classList.remove("d-none");
    
          navProfileBtn.innerHTML = `
            <div class="position-relative" style="display: inline-block;">
              <img src="/vncafe/vncafe/assets/person-circle.svg" role="button" id="profileToggle" width="40" height="40" class="rounded-circle" alt="Profile">
              <div id="profileCard" class="d-none position-absolute end-0 mt-2 p-3 bg-white shadow" style="width: 250px; z-index: 1000; border-radius: 8px;">
                <img src='/vncafe/vncafe/assets/img/demoprofileimage.jpeg' width="100" height="100" class="rounded-circle pb-2 user_profile_img" alt="User_profile_img"/>
                <p class="fw-bold mb-1">User Name: ${user.username}</p>
                <p class="text-muted small mb-2"> Email: ${user.email}</p>
                <button id="logoutBtn" class="btn btn-sm btn-danger all-btn w-100">Logout</button>
              </div>
            </div>
          `;
    
          const profileToggle = document.getElementById("profileToggle");
          const profileCard = document.getElementById("profileCard");
          const logoutBtn = document.getElementById("logoutBtn");
    
          if (profileToggle && profileCard) {
            profileToggle.addEventListener("click", () => {
              profileCard.classList.toggle("d-none");
            });
          }
          document.addEventListener("click", (e) => {
            if (!navProfileBtn.contains(e.target)) {
              if (profileCard) {
                profileCard.classList.add("d-none");
              }
            }
          });
    
          if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
              localStorage.removeItem("user");
              localStorage.removeItem("token");
              window.location.href = "/vncafe/vncafe/pages/index.html";
            });
          }
        }
      } else {
        if (navProfileBtn) navProfileBtn.classList.add("d-none");
        if (signDivBtn) signDivBtn.classList.remove("d-none");
      }
      </script>
