        <h4 class="mb-4 text-center">Payment Summary</h4>

          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="credit-tab" data-bs-toggle="pill" data-bs-target="#credit" type="button" role="tab">Credit Card</button>
          </li>
          <li class="nav-item" role="presentation">

        <div class="tab-content">
          <div class="tab-pane fade show active" id="upi" role="tabpanel">
            <div class="payment-fields">
              <input type="text" class="form-control" id="upiId" placeholder="Enter UPI ID">
            </div>
          </div>
          <div class="tab-pane fade" id="credit" role="tabpanel">
            <div class="payment-fields">
              <input type="text" class="form-control" id="creditCardNumber" placeholder="Credit Card Number">
              <input type="text" class="form-control" id="creditCardExpiry" placeholder="Expiry Date (MM/YY)">
              <input type="text" class="form-control" id="creditCardCVV" placeholder="CVV">
            </div>
          </div>
          <div class="tab-pane fade" id="debit" role="tabpanel">
            <div class="payment-fields">
              <input type="text" class="form-control" id="debitCardNumber" placeholder="Debit Card Number">
              <input type="text" class="form-control" id="debitCardExpiry" placeholder="Expiry Date (MM/YY)">
              <input type="text" class="form-control" id="debitCardCVV" placeholder="CVV">
            </div>
          </div>

        <button class="btn btn-primary w-100 mt-4" onclick="confirmPayment()">Confirm & Pay</button>

      <script>
        function getCartItems() {
          return JSON.parse(localStorage.getItem("menu_ids")) || [];
        }
    
        function getMenuData() {
          return JSON.parse(localStorage.getItem("menu")) || [];
        }
    
        function renderPaymentSummary() {
          const cart = getCartItems();
          const menu = getMenuData();
          const container = document.getElementById('orderSummary');
          let total = 0;
          container.innerHTML = '';
    
          cart.forEach(item => {
            const product = menu.find(p => p.id === item.id);
            if (!product) return;
            const subtotal = product.price * item.quantity;
            total += subtotal;
    
            container.innerHTML += `
              <div class="summary-item">
                <span>${product.name} x ${item.quantity}</span>
                <span>₹${subtotal.toFixed(2)}</span>
              </div>
            `;
          });
    
          document.getElementById('totalAmount').textContent = "₹" + total.toFixed(2);
        }
    
        function confirmPayment() {
          const upi = document.getElementById('upiId').value.trim();
          const creditCard = document.getElementById('creditCardNumber').value.trim();
          const creditExpiry = document.getElementById('creditCardExpiry').value.trim();
          const creditCVV = document.getElementById('creditCardCVV').value.trim();
          const debitCard = document.getElementById('debitCardNumber').value.trim();
          const debitExpiry = document.getElementById('debitCardExpiry').value.trim();
          const debitCVV = document.getElementById('debitCardCVV').value.trim();
    
          if (upi) {
            alert("Payment successful via UPI: " + upi);
          } else if (creditCard && creditExpiry && creditCVV) {
            alert("Payment successful via Credit Card ending " + creditCard.slice(-4));
          } else if (debitCard && debitExpiry && debitCVV) {
            alert("Payment successful via Debit Card ending " + debitCard.slice(-4));
          } else {
            alert("Please fill in the payment details.");
            return;
          }
    
          localStorage.removeItem("menu_ids");
          window.location.href = "/vncafe/vncafe/pages/order_success.html";
        }
    
        renderPaymentSummary();
      </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const paymentMethods = document.getElementById('paymentMethods');
            const selectedPaymentMethodInput = document.getElementById('selectedPaymentMethod');
            const paymentMethodError = document.getElementById('paymentMethodError');
            const creditCardFields = document.getElementById('creditCardFields');
            const debitCardFields = document.getElementById('debitCardFields');
            const upiFields = document.getElementById('upiFields');
            const placeOrderBtn = document.getElementById('placeOrderBtn');
            const loadingDiv = document.getElementById('loading');

            // Function to show/hide payment fields
            function showPaymentFields(method) {
                creditCardFields.style.display = 'none';
                debitCardFields.style.display = 'none';
                upiFields.style.display = 'none';

                if (method === 'creditcard') {
                    creditCardFields.style.display = 'block';
                } else if (method === 'debitcard') {
                    debitCardFields.style.display = 'block';
                } else if (method === 'upi') {
                    upiFields.style.display = 'block';
                }
            }

            // Event listener for selecting a payment method
            paymentMethods.addEventListener('click', function (event) {
                const target = event.target.closest('.payment-method');
                if (target) {
                    const method = target.getAttribute('data-method');
                    selectedPaymentMethodInput.value = method;
                    paymentMethodError.style.display = 'none';
                    showPaymentFields(method);


                    document.querySelectorAll('.payment-method').forEach(el => el.classList.remove('selected'));
                    target.classList.add('selected');
                }
            });
            function validateRequiredFields(containerId) {
                const container = document.getElementById(containerId);
                if (!container) return true;

                let isValid = true;
                const requiredFields = container.querySelectorAll('input[required]');
                requiredFields.forEach(field => {
                    if (!field.value.trim()) {
                        isValid = false;
                        field.classList.add('is-invalid');
                    } else {
                        field.classList.remove('is-invalid');
                    }
                });
                return isValid;
            }

            function validateCreditCardNumber() {
                const ccNumberInput = document.getElementById('cc-number');
                if (!creditCardFields.style.display || creditCardFields.style.display === 'none') return true;

                const cardNumber = ccNumberInput.value.replace(/\D/g, '');
                if (!/^\d{13,19}$/.test(cardNumber)) {
                    ccNumberInput.classList.add('is-invalid');
                    const feedbackDiv = ccNumberInput.nextElementSibling;
                    if (feedbackDiv && feedbackDiv.classList.contains('invalid-feedback')) {
                        feedbackDiv.textContent = 'Please enter a valid credit card number.';
                    }
                    return false;
                } else {
                    ccNumberInput.classList.remove('is-invalid');
                    return true;
                }
            }

            function validateDebitCardNumber() {
                const dcNumberInput = document.getElementById('dc-number');
                if (!debitCardFields.style.display || debitCardFields.style.display === 'none') return true;

                const cardNumber = dcNumberInput.value.replace(/\D/g, '');
                if (!/^\d{16}$/.test(cardNumber)) {
                    dcNumberInput.classList.add('is-invalid');
                    const feedbackDiv = dcNumberInput.nextElementSibling;
                    if (feedbackDiv && feedbackDiv.classList.contains('invalid-feedback')) {
                        feedbackDiv.textContent = 'Please enter a valid debit card number.';
                    }
                    return false;
                } else {
                    dcNumberInput.classList.remove('is-invalid');
                    return true;
                }
            }


            function validateExpiration(inputId) {
                const expiryInput = document.getElementById(inputId);
                if (!expiryInput || expiryInput.closest('[style*="display: none;"]')) return true;

                const expiryValue = expiryInput.value.trim();
                if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiryValue)) {
                    expiryInput.classList.add('is-invalid');
                    const feedbackDiv = expiryInput.nextElementSibling;
                    if (feedbackDiv && feedbackDiv.classList.contains('invalid-feedback')) {
                        feedbackDiv.textContent = 'Please enter a valid expiration date (MM/YY).';
                    }
                    return false;
                } else {
                    expiryInput.classList.remove('is-invalid');
                    return true;
                }
            }

            function validateCVV(inputId) {
                const cvvInput = document.getElementById(inputId);
                if (!cvvInput || cvvInput.closest('[style*="display: none;"]')) return true;

                const cvvValue = cvvInput.value.trim();
                if (!/^\d{3,4}$/.test(cvvValue)) {
                    cvvInput.classList.add('is-invalid');
                    const feedbackDiv = cvvInput.nextElementSibling;
                    if (feedbackDiv && feedbackDiv.classList.contains('invalid-feedback')) {
                        feedbackDiv.textContent = 'Please enter a valid CVV.';
                    }
                    return false;
                } else {
                    cvvInput.classList.remove('is-invalid');
                    return true;
                }
            }

            function validateUPIID() {
                const upiIdInput = document.getElementById('upi-id');
                if (!upiFields.style.display || upiFields.style.display === 'none') return true;

                const upiIdValue = upiIdInput.value.trim();
                if (!/^[a-zA-Z0-9.\-_]{2,}@[a-zA-Z]{2,}$/.test(upiIdValue)) {
                    upiIdInput.classList.add('is-invalid');
                    const feedbackDiv = upiIdInput.nextElementSibling;
                    if (feedbackDiv && feedbackDiv.classList.contains('invalid-feedback')) {
                        feedbackDiv.textContent = 'Please enter a valid UPI ID (e.g., yourname@bank).';
                    }
                    return false;
                } else {
                    upiIdInput.classList.remove('is-invalid');
                    return true;
                }
            }

            function showPaymentSuccessModal() {
                const modalHtml = `
            <div class="modal fade" id="paymentSuccessModal" tabindex="-1" aria-labelledby="paymentSuccessModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title" id="paymentSuccessModalLabel">Payment Successful!</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body text-center">
                            <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
                            <p class="mb-0">Your order has been placed successfully.</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <a href="../pages/index.html" class="btn btn-primary-flipkart">Go to Homepage</a>
                        </div>
                    </div>
                </div>
            </div>
        `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                const paymentSuccessModal = new bootstrap.Modal(document.getElementById('paymentSuccessModal'));
                paymentSuccessModal.show();

                document.getElementById('paymentSuccessModal').addEventListener('hidden.bs.modal', function () {
                    this.remove();
                });
            }

            // Event listener for the Place Order button
            placeOrderBtn.addEventListener('click', function (event) {
                event.preventDefault(); // Prevent default form submission

                let isPaymentValid = true;
                const selectedMethod = selectedPaymentMethodInput.value;

                if (!selectedMethod) {
                    paymentMethodError.style.display = 'block';
                    isPaymentValid = false;
                } else {
                    paymentMethodError.style.display = 'none';
                    if (selectedMethod === 'creditcard') {
                        isPaymentValid = validateRequiredFields('creditCardFields') && validateCreditCardNumber() && validateExpiration('cc-expiration') && validateCVV('cc-cvv');
                    } else if (selectedMethod === 'debitcard') {
                        isPaymentValid = validateRequiredFields('debitCardFields') && validateDebitCardNumber() && validateExpiration('dc-expiration') && validateCVV('dc-cvv');
                    } else if (selectedMethod === 'upi') {
                        isPaymentValid = validateRequiredFields('upiFields') && validateUPIID();
                    }
                }

                if (isPaymentValid) {
                    // Simulate order processing
                    placeOrderBtn.style.display = 'none';
                    loadingDiv.style.display = 'block';
                    setTimeout(function () {
                        loadingDiv.style.display = 'none';
                        showPaymentSuccessModal();
                 
                    }, 2000);
                } else {
                    
                }
            });
        });
    </script>

    <script>
        //  profile icon show user details
      
        const user = JSON.parse(localStorage.getItem("user"));
        const token = localStorage.getItem("token");
      
        const navProfileBtn = document.getElementById("navProfileBtn");
        const signDivBtn = document.getElementById("signDivBtn");
      
        if (user && token) {
          if (signDivBtn) {
            signDivBtn.classList.add("d-none");
          }
          if (navProfileBtn) {
            navProfileBtn.classList.remove("d-none");
      
            navProfileBtn.innerHTML = `
              <div class="position-relative" style="display: inline-block;">
                <img src="/vncafe/vncafe/assets/person-circle.svg" role="button" id="profileToggle" width="40" height="40" class="rounded-circle" alt="Profile">
                <div id="profileCard" class="d-none position-absolute end-0 mt-2 p-3 bg-white shadow" style="width: 250px; z-index: 1000; border-radius: 8px;">
                  <img src='/vncafe/vncafe/assets/img/demoprofileimage.jpeg' width="100" height="100" class="rounded-circle pb-2 user_profile_img" alt="User_profile_img"/>
                  <p class="fw-bold mb-1">User Name: ${user.username}</p>
                  <p class="text-muted small mb-2"> Email: ${user.email}</p>
                  <button id="logoutBtn" class="btn btn-sm btn-danger all-btn w-100">Logout</button>
                </div>
              </div>
            `;
      
            const profileToggle = document.getElementById("profileToggle");
            const profileCard = document.getElementById("profileCard");
            const logoutBtn = document.getElementById("logoutBtn");
      
            if (profileToggle && profileCard) {
              profileToggle.addEventListener("click", () => {
                profileCard.classList.toggle("d-none");
              });
            }
            document.addEventListener("click", (e) => {
              if (!navProfileBtn.contains(e.target)) {
                if (profileCard) {
                  profileCard.classList.add("d-none");
                }
              }
            });
      
            if (logoutBtn) {
              logoutBtn.addEventListener("click", () => {
                localStorage.removeItem("user");
                localStorage.removeItem("token");
                window.location.href = "/vncafe/vncafe/pages/index.html";
              });
            }
          }
        } else {
          if (navProfileBtn) navProfileBtn.classList.add("d-none");
          if (signDivBtn) signDivBtn.classList.remove("d-none");
        }
        </script>
